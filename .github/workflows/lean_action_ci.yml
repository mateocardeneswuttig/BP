name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

# A full build takes tens of minutes, so do not let pushes stack up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      # The generated certificate modules are memory-heavy. If this job is
      # reported as cancelled with exit code 143, the runner ran out of
      # memory; it is not a timeout.
      - uses: leanprover/lean-action@v1
      - name: Audit paper-facing theorem boundary
        run: python3 audit_public_theorem.py
      - uses: leanprover-community/docgen-action@v1
