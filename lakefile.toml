name = "hadamard6_formal"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Hadamard6"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
linter.style.header = false # no per-file copyright boilerplate in this research project
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "Hadamard6"
